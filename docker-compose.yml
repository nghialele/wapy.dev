services:
  db:
    container_name: subidler-db
    image: postgres:17.5
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-subidler}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-subidler}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - ./db:/var/lib/postgresql/data

  app:
    container_name: subidler-app
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      - db

  cron:
    container_name: subidler-cron
    image: alpine:3.22
    restart: unless-stopped
    command: >
      sh -c 'while true; do
        /usr/bin/flock -n /tmp/subidler.lockfile wget -qO- app:3000/api/cron/;
        sleep 60;
      done'
    depends_on:
      - app
